
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Slot & Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1 class="logo">NAIL PICK</h1>
        <button id="tabToggleBtn" class="text-btn">아카이브 보기</button>
    </header>

    <main id="mainView" class="view-container">
        <div class="subtitle">3주마다 찾아오는 즐거운 고민, 오늘의 네일을 뽑아보세요!</div>
        
        <div class="hands-wrapper">
            <div class="hand">
                <div class="finger" data-index="0"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="1"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="2"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="3"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="4"><div class="nail-slot">맨손톱</div></div>
            </div>
            <div class="hand">
                <div class="finger" data-index="5"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="6"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="7"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="8"><div class="nail-slot">맨손톱</div></div>
                <div class="finger" data-index="9"><div class="nail-slot">맨손톱</div></div>
            </div>
        </div>

        <div class="action-box">
            <button id="rollBtn" class="primary-btn">새로운 네일 뽑기 🎲</button>
            <button id="saveArchiveBtn" class="secondary-btn" style="display: none;">이 조합 아카이브에 저장하기 💾</button>
        </div>
    </main>

    <main id="archiveView" class="view-container" style="display: none;">
        <div class="archive-header">
            <h2>나의 네일 룩북</h2>
            <label for="photoUpload" class="upload-btn">+ 실제 손 사진 업로드 (템플릿 변환)</label>
            <input type="file" id="photoUpload" accept="image/*" style="display: none;">
        </div>

        <div id="archiveGrid" class="archive-grid">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
