<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Personal Nail Archive"
    >
    <meta
        name="theme-color"
        content="#ffffff"
    >
    <title>NAILS DONE.</title>
    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>
<body>
    <main class="page">
        <!-- HERO -->
        <section
            class="hero"
            aria-labelledby="siteTitle"
        >
            <p class="hero__caption">
                PERSONAL NAIL ARCHIVE
            </p>
            <h1
                id="siteTitle"
                class="hero__title"
            >
                <span>NAILS</span>
                <span>DONE.</span>
            </h1>
        </section>
        <!-- ARCHIVE DETAIL -->
        <section class="archive">
            <!-- PREVIOUS / NEXT -->
            <nav
                class="archiveNav"
                aria-label="네일 기록 이동"
            >
                <button
                    id="prevButton"
                    class="archiveNav__button"
                    type="button"
                >
                    ← PREVIOUS
                </button>
                <p
                    id="pageCounter"
                    class="archiveNav__counter"
                    aria-live="polite"
                >
                    1 / 1
                </p>
                <button
                    id="nextButton"
                    class="archiveNav__button"
                    type="button"
                >
                    NEXT →
                </button>
            </nav>
            <!-- JS RENDERING AREA -->
            <article
                id="detailPage"
                class="detailPage"
                aria-live="polite"
            >
            </article>
        </section>
    </main>
    <!-- IMAGE LIGHTBOX -->
    <dialog
        id="lightbox"
        class="lightbox"
    >
        <button
            id="lightboxClose"
            class="lightbox__close"
            type="button"
            aria-label="이미지 닫기"
        >
            ×
        </button>
        <img
            id="lightboxImage"
            class="lightbox__image"
            src=""
            alt=""
        >
    </dialog>
    <!-- DETAIL TEMPLATE -->
    <template id="detailTemplate">
        <section class="entry">
            <!-- DATE + TITLE -->
            <header class="entryHeader">
                <time class="entryDate">
                    <span class="entryDate__day"></span>
                    <span class="entryDate__month"></span>
                    <span class="entryDate__year"></span>
                </time>
                <div class="entryHeading">
                    <p class="entryHeading__number"></p>
                    <h2 class="entryHeading__title"></h2>
                </div>
            </header>
            <!-- NAIL GRAPHIC -->
            <section
                class="nailGraphicSection"
                aria-labelledby="nailGraphicTitle"
            >
                <h3
                    id="nailGraphicTitle"
                    class="sectionLabel"
                >
                    NAIL GRAPHIC
                </h3>
                <div class="nailGraphic">
                    <!-- SVG inserted by app.js -->
                </div>
            </section>
            <!-- META -->
            <section
                class="nailMeta"
                aria-label="네일 디자인 정보"
            >
                <div class="nailMeta__item">
                    <span class="nailMeta__label">
                        SHAPE
                    </span>
                    <span class="nailMeta__shape"></span>
                </div>
                <span
                    class="nailMeta__divider"
                    aria-hidden="true"
                ></span>
                <div class="nailMeta__item">
                    <span class="nailMeta__label">
                        FINISH
                    </span>
                    <div class="nailMeta__finish"></div>
                </div>
                <span
                    class="nailMeta__divider"
                    aria-hidden="true"
                ></span>
                <div class="nailMeta__item">
                    <span class="nailMeta__label">
                        COLOR
                    </span>
                    <div class="nailMeta__colors"></div>
                </div>
            </section>
            <!-- INSPIRATION -->
            <section
                class="contentSection inspirationSection"
                aria-labelledby="inspirationTitle"
            >
                <h3
                    id="inspirationTitle"
                    class="sectionLabel"
                >
                    INSPIRATION
                </h3>
                <div class="inspiration">
                    <button
                        class="inspiration__imageButton"
                        type="button"
                        aria-label="인스퍼레이션 이미지 확대"
                    >
                        <img
                            class="inspiration__image"
                            src=""
                            alt="네일 인스퍼레이션 이미지"
                        >
                    </button>
                    <p class="inspiration__memo"></p>
                </div>
            </section>
            <!-- ORIGINAL PHOTO -->
            <section
                class="contentSection originalSection"
                aria-labelledby="originalPhotoTitle"
            >
                <div class="sectionHeading">
                    <h3
                        id="originalPhotoTitle"
                        class="sectionLabel"
                    >
                        MY ORIGINAL PHOTO
                    </h3>
                    <button
                        class="originalSection__more"
                        type="button"
                        hidden
                    >
                        VIEW ALL
                    </button>
                </div>
                <div class="originalPhoto">
                    <button
                        class="originalPhoto__main"
                        type="button"
                        aria-label="대표 원본 사진 확대"
                    >
                        <img
                            class="originalPhoto__mainImage"
                            src=""
                            alt="실제 네일 대표 사진"
                        >
                    </button>
                    <div class="originalPhoto__preview"></div>
                </div>
            </section>
        </section>
    </template>
    <script
        src="./js/app.js"
        defer
    ></script>
</body>
</html>
