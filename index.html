<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="나의 네일아트 기록을 모아두는 개인 아카이브"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>NAILS DONE.</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <main class="archive">

        <!-- ==================================================
             HERO
        =================================================== -->

        <section class="hero">

            <h1 class="hero__title">
                NAILS <span>DONE.</span>
            </h1>

        </section>


        <!-- ==================================================
             VIEW CONTROLS
        =================================================== -->

        <section class="archiveToolbar">

            <div class="archiveToolbar__summary">

                <span
                    id="archiveCount"
                    class="archiveToolbar__count"
                >
                    0 RECORDS
                </span>

                <span
                    id="archivePeriod"
                    class="archiveToolbar__period"
                >
                </span>

            </div>


            <div
                class="viewSwitcher"
                aria-label="아카이브 보기 방식"
            >

                <button
                    class="viewSwitcher__button is-active"
                    type="button"
                    data-view="grid"
                    aria-pressed="true"
                >
                    GRID
                </button>

                <button
                    class="viewSwitcher__button"
                    type="button"
                    data-view="list"
                    aria-pressed="false"
                >
                    LIST
                </button>

            </div>

        </section>


        <!-- ==================================================
             GRID / LIST ARCHIVE
        =================================================== -->

        <section
            id="archiveCollection"
            class="archiveCollection archiveCollection--grid"
            aria-live="polite"
        >
        </section>


        <!-- ==================================================
             DETAIL VIEW
        =================================================== -->

        <section
            id="detailView"
            class="detailView"
            hidden
        >

            <div class="detailView__navigation">

                <button
                    id="detailPrevious"
                    class="detailView__navButton"
                    type="button"
                    aria-label="이전 네일 기록"
                >
                    ← PREVIOUS
                </button>

                <span
                    id="detailCounter"
                    class="detailView__counter"
                >
                    1 / 1
                </span>

                <button
                    id="detailNext"
                    class="detailView__navButton"
                    type="button"
                    aria-label="다음 네일 기록"
                >
                    NEXT →
                </button>

            </div>


            <article
                id="detailArticle"
                class="nailDetail"
            >
            </article>

        </section>


        <!-- ==================================================
             EMPTY / ERROR STATE
        =================================================== -->

        <section
            id="archiveMessage"
            class="archiveMessage"
            hidden
        >

            <h2
                id="archiveMessageTitle"
                class="archiveMessage__title"
            >
            </h2>

            <p
                id="archiveMessageText"
                class="archiveMessage__text"
            >
            </p>

        </section>

    </main>


    <!-- ==================================================
         CARD TEMPLATE
    =================================================== -->

    <template id="archiveCardTemplate">

        <article class="archiveCard">

            <button
                class="archiveCard__button"
                type="button"
            >

                <div class="archiveCard__visual">

                    <img
                        class="archiveCard__graphic"
                        alt=""
                    >

                </div>

                <div class="archiveCard__content">

                    <time class="archiveCard__date">
                    </time>

                    <h2 class="archiveCard__title">
                    </h2>

                    <div class="archiveCard__meta">

                        <span class="archiveCard__shape">
                        </span>

                        <span
                            class="archiveCard__finish"
                            aria-label="네일 특징"
                        >
                        </span>

                    </div>

                </div>

            </button>

        </article>

    </template>


    <!-- ==================================================
         DETAIL TEMPLATE
    =================================================== -->

    <template id="detailTemplate">

        <header class="nailDetail__header">

            <div>

                <time class="nailDetail__date">
                </time>

                <h2 class="nailDetail__title">
                </h2>

            </div>

            <span class="nailDetail__number">
            </span>

        </header>


        <!-- NAIL GRAPHIC -->

        <section class="detailSection detailSection--graphic">

            <div class="detailSection__heading">

                <h3 class="detailSection__label">
                    NAIL GRAPHIC
                </h3>

            </div>

            <button
                class="nailGraphicButton"
                type="button"
                aria-label="네일 그래픽 크게 보기"
            >

                <img
                    class="nailGraphicImage"
                    alt=""
                >

            </button>


            <dl class="nailMeta">

                <div class="nailMeta__item">

                    <dt>
                        SHAPE
                    </dt>

                    <dd class="nailMeta__shape">
                    </dd>

                </div>


                <div class="nailMeta__item">

                    <dt>
                        FINISH
                    </dt>

                    <dd class="nailMeta__finish">
                    </dd>

                </div>


                <div class="nailMeta__item">

                    <dt>
                        COLOR
                    </dt>

                    <dd class="nailMeta__colors">
                    </dd>

                </div>

            </dl>

        </section>


        <!-- INSPIRATION -->

        <section class="detailSection inspirationSection">

            <div class="detailSection__heading">

                <h3 class="detailSection__label">
                    INSPIRATION
                </h3>

            </div>

            <div class="inspiration">

                <button
                    class="inspiration__imageButton"
                    type="button"
                    aria-label="인스퍼레이션 이미지 크게 보기"
                >

                    <img
                        class="inspiration__image"
                        alt=""
                    >

                </button>

                <p class="inspiration__memo">
                </p>

            </div>

        </section>


        <!-- ORIGINAL PHOTO -->

        <section class="detailSection originalSection">

            <div class="detailSection__heading">

                <h3 class="detailSection__label">
                    MY ORIGINAL PHOTO
                </h3>

                <span class="detailSection__caption">
                    사진을 클릭하면 크게 볼 수 있어요.
                </span>

            </div>

            <div class="originalGallery">
            </div>

        </section>

    </template>


    <!-- ==================================================
         LIGHTBOX
    =================================================== -->

    <dialog
        id="lightbox"
        class="lightbox"
    >

        <button
            id="lightboxClose"
            class="lightbox__close"
            type="button"
            aria-label="이미지 닫기"
        >
            ×
        </button>

        <button
            id="lightboxPrevious"
            class="lightbox__navigation lightbox__navigation--previous"
            type="button"
            aria-label="이전 이미지"
        >
            ←
        </button>

        <figure class="lightbox__figure">

            <img
                id="lightboxImage"
                class="lightbox__image"
                alt=""
            >

            <figcaption
                id="lightboxCaption"
                class="lightbox__caption"
            >
            </figcaption>

        </figure>

        <button
            id="lightboxNext"
            class="lightbox__navigation lightbox__navigation--next"
            type="button"
            aria-label="다음 이미지"
        >
            →
        </button>

    </dialog>


    <script
        src="./js/app.js"
        defer
    ></script>

</body>
</html>
