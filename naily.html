<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-alt:rgba(120,120,150,0.08);
    --surface:rgba(255,255,255,0.6);
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --wine:#6C5CE7;
    --wine-dark:#FF3B30;
    --mauve:#B36FA0;
    --gold:#E3A72E;
    --line:rgba(60,60,67,0.16);
    --shadow:rgba(31,38,55,0.10);
    --glass-bg:rgba(255,255,255,0.55);
    --glass-bg-strong:rgba(255,255,255,0.75);
    --glass-border:rgba(255,255,255,0.7);
    --iris-vivid:linear-gradient(120deg,#FF9BBD,#7CB4F2);
    --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
    --font-hand:-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}

  /* BACKGROUND BLOBS — liquid colour behind the glass */
  .bg-blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .blob{position:absolute;border-radius:50%;filter:blur(65px);opacity:0.4;animation:blobDrift 22s ease-in-out infinite alternate;}
  .blob1{width:340px;height:340px;top:-60px;left:-80px;background:radial-gradient(circle,#FFC7DA,transparent 70%);}
  .blob2{width:300px;height:300px;top:-40px;right:-90px;background:radial-gradient(circle,#C3DDFB,transparent 70%);animation-delay:-6s;}
  .blob3{width:320px;height:320px;bottom:80px;left:-100px;background:radial-gradient(circle,#C3DDFB,transparent 70%);animation-delay:-12s;}
  .blob4{width:300px;height:300px;bottom:40px;right:-80px;background:radial-gradient(circle,#FFC7DA,transparent 70%);animation-delay:-3s;}
  @keyframes blobDrift{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(18px,-22px) scale(1.08);}
  }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
  }

  /* HEADER */
  .app-header{
    padding:28px 20px 16px;
    text-align:center;
  }
  .app-header h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .app-header h1 .grad-title{
    background:var(--iris-vivid);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
  }
  .app-header .tagline{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:0.2px;
  }

  /* MAIN / PANELS */
  .app-main{
    flex:1;
    padding:18px 16px 100px;
    overflow-y:auto;
    position:relative;
    z-index:1;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .filter-block h2{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:16px 0 8px;
    letter-spacing:0.3px;
  }
  .filter-block h2:first-child{margin-top:2px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--wine);
    border-color:var(--wine);
    color:#fff;
  }
  .chip .dot{
    width:12px;height:12px;border-radius:50%;
    border:1px solid rgba(0,0,0,0.12);
    flex-shrink:0;
  }
  .hint-text{font-size:11.5px;color:var(--ink-soft);margin:6px 2px 0;}

  .btn-primary{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:var(--iris-vivid);
    color:#fff;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(108,92,231,0.28), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .1s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:1px solid var(--glass-border);
    border-radius:16px;
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    color:var(--ink);
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-ghost{
    background:none;border:none;color:var(--wine);
    font-size:13.5px;font-weight:600;cursor:pointer;padding:8px;
  }

  /* NAIL SHAPE — signature element */
  .photo-frame{
    width:100%;
    aspect-ratio:3/4;
    border-radius:50% 50% 8% 8% / 62% 62% 8% 8%;
    overflow:hidden;
    background:var(--glass-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border:1px solid var(--glass-border);
  }
  .photo-frame img{width:100%;height:100%;object-fit:cover;}
  .photo-frame .placeholder-icon{font-size:28px;opacity:0.35;}

  /* HANDS — illustration with slot-machine nail overlays */
  .hands-illustration{
    position:relative;width:100%;aspect-ratio:3968/3808;
    margin-top:22px;border-radius:26px;overflow:hidden;
    background:#fff;
    box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
    border:1px solid var(--glass-border);
  }
  .hands-illustration > img{width:100%;height:100%;object-fit:cover;display:block;}
  .overlay-nail{position:absolute;}
  .overlay-nail .finger-lift{width:100%;height:100%;}
  .overlay-nail .finger-lift.wiggle{animation:fingerWiggle .32s ease;}
  @keyframes fingerWiggle{
    0%{transform:translateY(0) rotate(0deg);}
    35%{transform:translateY(-5px) rotate(3deg);}
    70%{transform:translateY(1px) rotate(-1.5deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }
  .overlay-nail .nail-slot{
    width:100%;height:100%;position:relative;overflow:hidden;
    border-radius:50% 50% 46% 46% / 64% 64% 36% 36%;
    display:flex;align-items:flex-start;justify-content:flex-start;
  }
  .overlay-nail .nail-slot.thumb-shape-left{
    border-radius:50% 20% 20% 50% / 58% 30% 22% 42%;
  }
  .overlay-nail .nail-slot.thumb-shape-right{
    border-radius:20% 50% 50% 20% / 30% 58% 42% 22%;
  }
  .overlay-nail .nail-slot.active{background:var(--glass-bg-strong);border:1px solid rgba(255,255,255,0.25);}
  .overlay-nail .nail-slot.active::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0.22), transparent 22%, transparent 78%, rgba(0,0,0,0.22));
  }
  .overlay-nail .placeholder-icon{margin:auto;font-size:11px;opacity:0.4;}
  .overlay-nail .reel{display:flex;flex-direction:column;width:100%;}
  .overlay-nail .reel.spinning{animation:reelBlur var(--dur, 1000ms) ease-out;}
  @keyframes reelBlur{
    0%{filter:blur(0);}
    10%{filter:blur(4px);}
    70%{filter:blur(3px);}
    100%{filter:blur(0);}
  }
  .overlay-nail .reel-item{
    width:100%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:var(--glass-bg);
  }
  .overlay-nail .reel-item img{width:100%;height:100%;object-fit:cover;}
  .overlay-nail .nail-slot.landed{animation:nailBounce .34s ease;}
  @keyframes nailBounce{
    0%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0);}
    40%{transform:scale(1.22);box-shadow:0 0 14px 4px rgba(255,255,255,0.85);}
    100%{transform:scale(1);box-shadow:0 0 0 rgba(255,255,255,0);}
  }
  .pop-label{
    position:absolute;top:-8px;left:50%;font-size:13px;pointer-events:none;
    animation:popFloat .5s ease forwards;
  }
  @keyframes popFloat{
    0%{opacity:0;transform:translate(-50%,6px) scale(0.6);}
    30%{opacity:1;transform:translate(-50%,-8px) scale(1.1);}
    100%{opacity:0;transform:translate(-50%,-18px) scale(1);}
  }
  .btn-primary:disabled{opacity:0.55;cursor:default;}

  /* RESULT CARD */
  .result-area{margin-top:20px;}
  .empty-hint{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1.5px dashed var(--line);
    border-radius:20px;
  }
  .empty-hint .big{font-size:30px;display:block;margin-bottom:10px;}
  .result-card{
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:24px;
    padding:18px;
    box-shadow:0 10px 28px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .result-card .photo-frame{max-width:220px;margin:0 auto;}
  .result-card .photo-frame.just-revealed::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%);
    transform:translateX(-120%);
    animation:sheen 0.9s ease forwards;
  }
  @keyframes sheen{to{transform:translateX(120%);}}
  .result-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    text-align:center;
    margin:14px 0 6px;
  }
  .result-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;}
  .tag-mini{
    font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(120,120,150,0.10);color:var(--ink-soft);
  }
  .result-memo{
    font-family:var(--font-hand);
    font-style:italic;
    font-size:14px;
    text-align:center;
    color:var(--ink-soft);
    margin:0 0 4px;
    min-height:1em;
  }

  /* CARD GRID (candidates) */
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .candidate-card{
    background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:10px;
    cursor:pointer;
    position:relative;
    box-shadow:0 6px 18px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .candidate-card .c-title{
    font-size:13.5px;font-weight:700;margin:8px 2px 3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .candidate-card .c-tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 2px;}
  .candidate-card .last-done{
    font-size:10.5px;color:var(--mauve);margin:5px 2px 0;
  }

  /* ARCHIVE */
  .archive-stats{
    background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:18px;
    padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--ink-soft);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .archive-stats b{color:var(--wine);font-size:15px;}
  .archive-list{position:relative;padding-left:14px;}
  .archive-list::before{
    content:'';position:absolute;left:0;top:6px;bottom:6px;
    border-left:2px dashed var(--line);
  }
  .archive-item{
    display:flex;gap:12px;background:var(--glass-bg);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:18px;
    padding:10px;margin-bottom:12px;margin-left:8px;position:relative;cursor:pointer;
    box-shadow:0 6px 18px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .archive-item::before{
    content:'';position:absolute;left:-13px;top:18px;
    width:8px;height:8px;border-radius:50%;background:var(--iris-vivid);
  }
  .archive-item .photo-frame{width:64px;flex-shrink:0;aspect-ratio:3/4;}
  .archive-item .a-body{flex:1;min-width:0;}
  .archive-item .a-date{font-size:11.5px;color:var(--ink-soft);}
  .archive-item .a-salon{font-size:14px;font-weight:700;margin:2px 0;}
  .archive-item .a-stars{color:var(--gold);font-size:12.5px;letter-spacing:1px;}
  .archive-item .a-memo{
    font-family:var(--font-hand);font-style:italic;font-size:13px;color:var(--ink-soft);
    margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .empty-state{
    text-align:center;padding:50px 24px;color:var(--ink-soft);font-size:13.5px;
  }
  .empty-state .big{font-size:34px;display:block;margin-bottom:12px;}

  .quick-photo-add{
    display:block;text-align:center;cursor:pointer;
    padding:18px;margin-bottom:14px;
    background:var(--glass-bg);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1.5px dashed var(--line);
    border-radius:18px;
    font-size:13px;color:var(--ink-soft);font-weight:600;
  }
  .quick-photo-add .big{font-size:24px;display:block;margin-bottom:6px;}

  .inspire-mode-toggle{display:flex;gap:8px;margin-bottom:18px;}
  .inspire-mode-toggle .chip{flex:1;justify-content:center;}
  #inspireKeywordInput{margin-bottom:10px;}

  /* FAB */
  .fab{
    position:fixed;
    right:calc(50% - 240px + 20px);
    bottom:82px;
    width:52px;height:52px;border-radius:50%;
    background:var(--iris-vivid);color:#fff;border:none;
    font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 8px 20px rgba(108,92,231,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    z-index:20;
  }
  @media (max-width:520px){
    .fab{right:20px;}
  }

  /* TAB BAR */
  .tab-bar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    width:100%;max-width:480px;
    bottom:0;
    display:flex;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border-top:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .tab-btn{
    flex:1;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--ink-soft);padding:4px 0;
  }
  .tab-btn span{font-size:11px;}
  .tab-btn.active{color:var(--wine);font-weight:700;}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,30,0.35);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-box{
    background:var(--glass-bg-strong);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;
    border-radius:26px 26px 0 0;
    border-top:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .modal-box h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 16px;}
  .form-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;display:block;}
  .form-label:first-of-type{margin-top:0;}
  .form-input, .form-textarea{
    width:100%;padding:11px 13px;border:1px solid var(--glass-border);
    border-radius:12px;background:rgba(255,255,255,0.7);font-size:14px;color:var(--ink);
  }
  .form-input:focus, .form-textarea:focus{
    outline:none;border-color:var(--wine);box-shadow:0 0 0 3px rgba(108,92,231,0.18);
  }
  .form-textarea{resize:vertical;min-height:60px;font-family:var(--font-hand);font-size:15px;}
  .photo-upload{display:block;width:140px;margin:0 auto;cursor:pointer;position:relative;}
  .photo-upload .change-label{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    background:rgba(20,20,30,0.6);color:#fff;font-size:10.5px;
    padding:3px 9px;border-radius:999px;white-space:nowrap;
  }
  .star-input{display:flex;gap:6px;font-size:26px;}
  .star-btn{background:none;border:none;cursor:pointer;color:var(--line);padding:0;}
  .star-btn.active{color:var(--gold);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn-primary, .modal-actions .btn-secondary{margin-top:0;}
  .btn-danger{
    width:100%;margin-top:10px;padding:12px;border:none;border-radius:14px;
    background:none;color:var(--wine-dark);font-size:13px;cursor:pointer;
  }
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>
<div class="app">

  <header class="app-header">
    <h1>✨ <span class="grad-title">Naily</span></h1>
    <p class="tagline">오늘은 어떤 네일을 해볼까?</p>
  </header>

  <main class="app-main">

    <section id="panel-pick" class="panel active">
      <div class="filter-block">
        <h2>계절</h2>
        <div class="chip-row" id="chipsSeason"></div>
        <h2>컬러</h2>
        <div class="chip-row" id="chipsColor"></div>
        <h2>무드</h2>
        <div class="chip-row" id="chipsMood"></div>
        <p class="hint-text">아무 것도 선택하지 않으면 전체 후보에서 뽑아요</p>
      </div>
      <button class="btn-primary" id="drawBtn">✨ 디자인 뽑기</button>
    </section>

    <section id="panel-inspire" class="panel">
      <div class="inspire-mode-toggle">
        <button type="button" class="chip active" id="modeKeywordBtn">📝 키워드</button>
        <button type="button" class="chip" id="modeImageBtn">🖼 이미지</button>
      </div>

      <div id="inspireKeywordBlock">
        <p class="hint-text">여름, 바다, 웨딩처럼 떠오르는 단어를 적어보세요</p>
        <input class="form-input" id="inspireKeywordInput" placeholder="예: 여름 바다">
        <button class="btn-primary" id="inspireKeywordBtn">🔍 키워드로 찾기</button>
      </div>

      <div id="inspireImageBlock" style="display:none;">
        <p class="hint-text">사진 속 색감과 어울리는 디자인을 찾아드려요</p>
        <label class="quick-photo-add" for="inspireImageInput">
          <span class="big">🖼</span>
          사진 올리고 색감 분석하기
        </label>
        <input type="file" id="inspireImageInput" accept="image/*" style="display:none">
        <p class="hint-text" id="inspireColorFeedback"></p>
      </div>

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- image compression ---------- */
  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 480; quality = quality || 0.7;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
          else if (h >= w && h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- tab navigation ---------- */
  const panels = { pick:'panel-pick', inspire:'panel-inspire', candidates:'panel-candidates', archive:'panel-archive' };
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });
  function showTab(name){
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
    Object.entries(panels).forEach(([key, id]) => {
      document.getElementById(id).classList.toggle('active', key===name);
    });
    document.getElementById('handsArea').style.display = (name === 'pick' || name === 'inspire') ? '' : 'none';
    document.getElementById('recommendResult').style.display = (name === 'pick' || name === 'inspire') ? '' : 'none';
    const fab = document.getElementById('fabAdd');
    fab.hidden = !(name === 'candidates' || name === 'archive');
    fab.onclick = name === 'candidates' ? () => openCandidateModal(null)
                : name === 'archive' ? () => openArchiveModal(null, null)
                : null;
  }

  /* ---------- chip rendering ---------- */
  function renderChipRow(containerId, options, selectedArr, isColor, onToggle){
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    options.forEach(opt => {
      const label = isColor ? opt.name : opt;
      const value = label;
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (selectedArr.includes(value) ? ' active' : '');
      if (isColor){
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = opt.hex;
        chip.appendChild(dot);
      }
      chip.appendChild(document.createTextNode(label));
      chip.addEventListener('click', () => onToggle(value));
      el.appendChild(chip);
    });
  }

  /* ---------- RECOMMEND TAB ---------- */
  const filterState = { season:[], color:[], mood:[] };
  let lastDrawnId = null;

  function toggleFilter(group, value){
    const arr = filterState[group];
    const i = arr.indexOf(value);
    if (i>-1) arr.splice(i,1); else arr.push(value);
    renderFilters();
  }
  function renderFilters(){
    renderChipRow('chipsSeason', SEASONS, filterState.season, false, v => toggleFilter('season', v));
    renderChipRow('chipsColor', COLORS, filterState.color, true, v => toggleFilter('color', v));
    renderChipRow('chipsMood', MOODS, filterState.mood, false, v => toggleFilter('mood', v));
  }

  function getActivePool(){
    return candidates.length > 0 ? candidates : SAMPLE_DESIGNS;
  }

  function getFilteredCandidates(){
    return getActivePool().filter(c => {
      const seasonOk = filterState.season.length===0 || c.season.some(s => filterState.season.includes(s));
      const colorOk = filterState.color.length===0 || c.color.some(s => filterState.color.includes(s));
      const moodOk = filterState.mood.length===0 || c.mood.some(s => filterState.mood.includes(s));
      return seasonOk && colorOk && moodOk;
    });
  }

  document.getElementById('drawBtn').addEventListener('click', draw);

  const SPIN_DURATIONS = [850, 1000, 1150, 1300, 1450, 970, 1120, 1270, 1420, 1570];
  const REEL_LENGTH = 10;

  function thumbHtml(c){
    return (c && c.photo) ? '<img src="'+c.photo+'">' : '<span class="placeholder-icon">💅</span>';
  }

  function draw(){
    let fillerPool = getFilteredCandidates();
    if (fillerPool.length === 0){
      fillerPool = getActivePool(); // 필터에 맞는 게 없으면 필터를 무시하고 전체에서 추천
    }
    if (fillerPool.length === 0){
      renderInlineMessage('아직 등록된 디자인이 없어요.', '후보함에 디자인을 추가해보세요!');
      return;
    }
    let pickPool = fillerPool;
    if (lastDrawnId && pickPool.length > 1){
      pickPool = pickPool.filter(c => c.id !== lastDrawnId);
    }
    const pick = pickPool[Math.floor(Math.random() * pickPool.length)];
    lastDrawnId = pick.id;
    spin(pick, fillerPool, draw);
  }

  function renderInlineMessage(title, sub){
    document.getElementById('recommendResult').innerHTML =
      '<div class="empty-hint"><span class="big">💅</span>' + escapeHtml(title) + '<br>' + escapeHtml(sub) + '</div>';
  }

  function setTriggerButtonsDisabled(disabled){
    const drawBtn = document.getElementById('drawBtn');
    const inspireBtn = document.getElementById('inspireKeywordBtn');
    if (drawBtn) drawBtn.disabled = disabled;
    if (inspireBtn) inspireBtn.disabled = disabled;
  }

  function spin(pick, fillerPool, onRedraw){
    setTriggerButtonsDisabled(true);
    document.getElementById('recommendResult').innerHTML = '';
    let completed = 0;

    for (let i = 0; i < 10; i++){
      const slot = document.getElementById('nail' + i);
      slot.classList.remove('landed');
      slot.classList.add('active');
      const itemHeight = slot.offsetHeight;
      const items = [];
      for (let j = 0; j < REEL_LENGTH - 1; j++){
        items.push(thumbHtml(fillerPool[Math.floor(Math.random() * fillerPool.length)]));
      }
      items.push(thumbHtml(pick));
      slot.innerHTML = '<div class="reel">' + items.map(it => '<div class="reel-item" style="height:'+itemHeight+'px">'+it+'</div>').join('') + '</div>';

      const reel = slot.querySelector('.reel');
      void reel.offsetHeight; // force reflow so the transition below actually animates
      reel.style.setProperty('--dur', SPIN_DURATIONS[i] + 'ms');
      reel.classList.add('spinning');
      reel.style.transition = 'transform ' + SPIN_DURATIONS[i] + 'ms cubic-bezier(0.1,0.8,0.2,1)';
      requestAnimationFrame(() => { reel.style.transform = 'translateY(-' + ((REEL_LENGTH-1)/REEL_LENGTH*100) + '%)'; });

      reel.addEventListener('transitionend', function onEnd(){
        reel.removeEventListener('transitionend', onEnd);
        reel.classList.remove('spinning');
        slot.classList.add('landed');
        spawnWiggle(slot.parentElement);
        spawnPop(slot);
        playDing(i);
        completed++;
        if (completed === 10){
          setTimeout(() => {
            showInfoPanel(pick, onRedraw);
            setTriggerButtonsDisabled(false);
          }, 150);
        }
      });
    }
  }

  function spawnPop(slot){
    const label = document.createElement('span');
    label.className = 'pop-label';
    label.textContent = '✨';
    slot.appendChild(label);
    setTimeout(() => label.remove(), 520);
  }

  function spawnWiggle(liftEl){
    liftEl.classList.remove('wiggle');
    void liftEl.offsetWidth; // restart animation even if triggered again quickly
    liftEl.classList.add('wiggle');
  }

  let audioCtx = null;
  const CHARARANG_FREQS = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; // 도-미-솔-도-미-솔
  function playDing(i){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = CHARARANG_FREQS[i % CHARARANG_FREQS.length];
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 1.1);
    } catch(e){ /* 오디오를 지원하지 않으면 조용히 무시 */ }
  }

  function showInfoPanel(c, onRedraw){
    const tags = [...c.season, ...c.color, ...c.mood];
    const html =
      '<div class="result-card">' +
        '<div class="result-title">'+escapeHtml(c.title)+'</div>' +
        '<div class="result-tags">' + tags.map(t=>'<span class="tag-mini">'+escapeHtml(t)+'</span>').join('') + '</div>' +
        (c.memo ? '<p class="result-memo">"'+escapeHtml(c.memo)+'"</p>' : '') +
        '<button class="btn-secondary" id="redrawBtn">🔄 다시 뽑기</button>' +
        '<button class="btn-primary" id="quickSaveBtn">⚡ 바로 저장</button>' +
        '<button class="btn-ghost" id="detailSaveBtn" style="display:block;width:100%;text-align:center;">자세히 기록하기 (사진·샵·별점·메모)</button>' +
      '</div>';
    document.getElementById('recommendResult').innerHTML = html;
    document.getElementById('redrawBtn').addEventListener('click', onRedraw || draw);
    document.getElementById('quickSaveBtn').addEventListener('click', function(){ quickSaveArchive(c, this); });
    document.getElementById('detailSaveBtn').addEventListener('click', () => openArchiveModal(null, c));
  }

  function quickSaveArchive(c, btn){
    archive.push({
      id: uid(), candidateId: c.id, title: c.title,
      date: todayStr(), salon: getLastSalon(), rating: 0, memo: '', photo: c.photo
    });
    c.lastDoneAt = todayStr();
    saveCandidates();
    saveArchive();
    renderArchive();
    renderCandidates();
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = '✓ 저장됐어요!';
    setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 1400);
  }

  /* ---------- INSPIRE TAB (keyword / image) ---------- */
  const modeKeywordBtn = document.getElementById('modeKeywordBtn');
  const modeImageBtn = document.getElementById('modeImageBtn');
  const inspireKeywordBlock = document.getElementById('inspireKeywordBlock');
  const inspireImageBlock = document.getElementById('inspireImageBlock');

  modeKeywordBtn.addEventListener('click', () => {
    modeKeywordBtn.classList.add('active');
    modeImageBtn.classList.remove('active');
    inspireKeywordBlock.style.display = '';
    inspireImageBlock.style.display = 'none';
  });
  modeImageBtn.addEventListener('click', () => {
    modeImageBtn.classList.add('active');
    modeKeywordBtn.classList.remove('active');
    inspireImageBlock.style.display = '';
    inspireKeywordBlock.style.display = 'none';
  });

  function pickAndSpinFrom(matches, onRedraw){
    let pickPool = matches;
    if (lastDrawnId && pickPool.length > 1){
      pickPool = pickPool.filter(c => c.id !== lastDrawnId);
    }
    const pick = pickPool[Math.floor(Math.random() * pickPool.length)];
    lastDrawnId = pick.id;
    spin(pick, matches, onRedraw);
  }

  function searchByKeyword(rawKeyword){
    const kw = (rawKeyword || '').trim().toLowerCase();
    if (!kw) return;
    const pool = getActivePool();
    const matches = pool.filter(c => {
      const hay = [c.title, c.memo, ...c.season, ...c.color, ...c.mood].join(' ').toLowerCase();
      return hay.includes(kw);
    });
    if (matches.length === 0){
      renderInlineMessage('"'+rawKeyword.trim()+'"에 맞는 디자인이 아직 없어요.', '다른 키워드를 시도하거나 후보함에 추가해보세요!');
      return;
    }
    pickAndSpinFrom(matches, () => searchByKeyword(rawKeyword));
  }

  document.getElementById('inspireKeywordBtn').addEventListener('click', () => {
    searchByKeyword(document.getElementById('inspireKeywordInput').value);
  });
  document.getElementById('inspireKeywordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchByKeyword(e.target.value);
  });

  function loadImageFromFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function hexToRgb(hex){
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }

  function nearestColorName(rgb){
    let best = null, bestDist = Infinity;
    COLORS.forEach(opt => {
      if (opt.hex[0] !== '#') return; // 그라데이션(멀티/파스텔)은 거리 계산에서 제외
      const c2 = hexToRgb(opt.hex);
      const d = Math.sqrt((rgb[0]-c2[0])**2 + (rgb[1]-c2[1])**2 + (rgb[2]-c2[2])**2);
      if (d < bestDist){ bestDist = d; best = opt.name; }
    });
    return best;
  }

  function extractDominantColors(imgEl, count){
    const size = 32;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, size, size);
    const data = ctx.getImageData(0, 0, size, size).data;
    const buckets = {};
    for (let i = 0; i < data.length; i += 4){
      const a = data[i+3];
      if (a < 128) continue;
      const qr = Math.round(data[i]/32)*32, qg = Math.round(data[i+1]/32)*32, qb = Math.round(data[i+2]/32)*32;
      const key = qr+','+qg+','+qb;
      buckets[key] = (buckets[key]||0) + 1;
    }
    const sorted = Object.entries(buckets).sort((a,b) => b[1]-a[1]);
    const results = [];
    for (const [key] of sorted){
      const rgb = key.split(',').map(Number);
      const name = nearestColorName(rgb);
      if (name && !results.includes(name)) results.push(name);
      if (results.length >= count) break;
    }
    return results;
  }

  function searchByColors(colorNames){
    document.getElementById('inspireColorFeedback').textContent =
      colorNames.length ? '이 사진에서 뽑은 색: ' + colorNames.join(', ') : '';
    if (colorNames.length === 0){
      renderInlineMessage('색상을 읽지 못했어요.', '다른 사진으로 시도해보세요!');
      return;
    }
    const pool = getActivePool();
    const matches = pool.filter(c => c.color.some(col => colorNames.includes(col)));
    if (matches.length === 0){
      renderInlineMessage('비슷한 색의 디자인이 아직 없어요.', colorNames.join('/') + ' 계열을 후보함에 추가해보세요!');
      return;
    }
    pickAndSpinFrom(matches, () => searchByColors(colorNames));
  }

  document.getElementById('inspireImageInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('inspireColorFeedback').textContent = '색감을 분석하는 중...';
    try{
      const img = await loadImageFromFile(file);
      const colors = extractDominantColors(img, 3);
      searchByColors(colors);
    } catch(err){
      renderInlineMessage('사진을 읽지 못했어요.', '다른 사진으로 다시 시도해주세요!');
    }
    e.target.value = '';
  });

  /* ---------- CANDIDATES TAB ---------- */
  function daysAgo(iso){
    const d = new Date(iso + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    return Math.round((today - d) / 86400000);
  }

  function renderCandidates(){
    const grid = document.getElementById('candidatesGrid');
    const empty = document.getElementById('candidatesEmpty');
    empty.hidden = candidates.length > 0;
    grid.innerHTML = candidates.map(c => {
      const tags = [...c.season, ...c.color, ...c.mood].slice(0,3);
      return '<div class="candidate-card" data-id="'+c.id+'">' +
        '<div class="photo-frame">' + (c.photo ? '<img src="'+c.photo+'">' : '<span class="placeholder-icon">💅</span>') + '</div>' +
        '<div class="c-title">' + escapeHtml(c.title) + '</div>' +
        '<div class="c-tags">' + tags.map(t=>'<span class="tag-mini">'+escapeHtml(t)+'</span>').join('') + '</div>' +
        (c.lastDoneAt ? '<div class="last-done">마지막으로 함: '+daysAgo(c.lastDoneAt)+'일 전</div>' : '') +
      '</div>';
    }).join('');
    grid.querySelectorAll('.candidate-card').forEach(card => {
      card.addEventListener('click', () => openCandidateModal(card.dataset.id));
    });
  }

  /* ---------- ARCHIVE TAB ---------- */
  function renderArchive(){
    const list = document.getElementById('archiveList');
    const empty = document.getElementById('archiveEmpty');
    const stats = document.getElementById('archiveStats');
    empty.hidden = archive.length > 0;
    if (archive.length === 0){
      stats.innerHTML = '';
    } else {
      stats.innerHTML = '지금까지 총 <b>' + archive.length + '번</b>의 네일을 기록했어요';
    }
    const sorted = [...archive].sort((a,b) => b.date.localeCompare(a.date));
    list.innerHTML = sorted.map(a => {
      return '<div class="archive-item" data-id="'+a.id+'">' +
        '<div class="photo-frame">' + (a.photo ? '<img src="'+a.photo+'">' : '<span class="placeholder-icon">💅</span>') + '</div>' +
        '<div class="a-body">' +
          '<div class="a-date">'+formatDate(a.date)+'</div>' +
          '<div class="a-salon">'+escapeHtml(a.salon||'샵 이름 없음')+'</div>' +
          '<div class="a-stars">'+starsDisplay(a.rating||0)+'</div>' +
          (a.memo ? '<div class="a-memo">'+escapeHtml(a.memo)+'</div>' : '') +
          '<button type="button" class="btn-ghost similar-btn" data-id="'+a.id+'" style="padding:4px 0;">🔁 비슷한 느낌 다시 추천</button>' +
        '</div>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.archive-item').forEach(item => {
      item.addEventListener('click', () => openArchiveModal(item.dataset.id, null));
    });
    list.querySelectorAll('.similar-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        recommendSimilarTo(btn.dataset.id);
      });
    });
  }

  function recommendSimilarTo(archiveId){
    const entry = archive.find(a => a.id === archiveId);
    if (!entry) return;
    const linkedCandidate = entry.candidateId ? candidates.find(c => c.id === entry.candidateId) : null;
    if (linkedCandidate){
      filterState.season = [...linkedCandidate.season];
      filterState.color = [...linkedCandidate.color];
      filterState.mood = [...linkedCandidate.mood];
      renderFilters();
      showTab('pick');
      draw();
    } else {
      showTab('inspire');
      modeKeywordBtn.click();
      document.getElementById('inspireKeywordInput').value = entry.title;
      searchByKeyword(entry.title);
    }
  }

  document.getElementById('quickPhotoInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const photo = await compressImage(file);
    archive.push({
      id: uid(), candidateId: null, title: '실사진 기록',
      date: todayStr(), salon: getLastSalon(), rating: 0, memo: '', photo
    });
    saveArchive();
    renderArchive();
    e.target.value = '';
  });

  /* ---------- MODAL: shared ---------- */
  const overlay = document.getElementById('modalOverlay');
  const box = document.getElementById('modalBox');
  function closeModal(){ overlay.hidden = true; box.innerHTML = ''; }
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });

  function bindPhotoUpload(inputId, frameId, onDone){
    document.getElementById(inputId).addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await compressImage(file);
      document.getElementById(frameId).innerHTML = '<img src="'+dataUrl+'">';
      onDone(dataUrl);
    });
  }

  /* ---------- CANDIDATE MODAL ---------- */
  function openCandidateModal(editId){
    const existing = editId ? candidates.find(c => c.id === editId) : null;
    let photoData = existing ? existing.photo : null;
    const tagState = {
      season: existing ? [...existing.season] : [],
      color: existing ? [...existing.color] : [],
      mood: existing ? [...existing.mood] : []
    };

    box.innerHTML =
      '<h2>' + (existing ? '디자인 수정' : '새 디자인 추가') + '</h2>' +
      '<label class="photo-upload" for="candPhotoInput">' +
        '<div class="photo-frame" id="candPhotoFrame">' +
          (photoData ? '<img src="'+photoData+'">' : '<span class="placeholder-icon">📷</span>') +
        '</div>' +
        '<span class="change-label">사진 선택</span>' +
      '</label>' +
      '<input type="file" id="candPhotoInput" accept="image/*" style="display:none">' +
      '<label class="form-label">디자인 이름</label>' +
      '<input class="form-input" id="candTitle" placeholder="예: 가을 브라운 프렌치" value="'+escapeHtml(existing?existing.title:'')+'">' +
      '<label class="form-label">계절</label><div class="chip-row" id="candChipsSeason"></div>' +
      '<label class="form-label">컬러</label><div class="chip-row" id="candChipsColor"></div>' +
      '<label class="form-label">무드</label><div class="chip-row" id="candChipsMood"></div>' +
      '<label class="form-label">메모</label>' +
      '<textarea class="form-textarea" id="candMemo" placeholder="이 디자인에 대한 메모">'+escapeHtml(existing?existing.memo:'')+'</textarea>' +
      '<div class="modal-actions">' +
        '<button class="btn-secondary" id="candCancel">취소</button>' +
        '<button class="btn-primary" id="candSave">저장</button>' +
      '</div>' +
      (existing ? '<button class="btn-danger" id="candDelete">이 디자인 삭제</button>' : '');

    overlay.hidden = false;

    function rerenderTagChips(){
      renderChipRow('candChipsSeason', SEASONS, tagState.season, false, v => { toggleIn(tagState.season, v); rerenderTagChips(); });
      renderChipRow('candChipsColor', COLORS, tagState.color, true, v => { toggleIn(tagState.color, v); rerenderTagChips(); });
      renderChipRow('candChipsMood', MOODS, tagState.mood, false, v => { toggleIn(tagState.mood, v); rerenderTagChips(); });
    }
    function toggleIn(arr, v){ const i = arr.indexOf(v); if (i>-1) arr.splice(i,1); else arr.push(v); }
    rerenderTagChips();

    bindPhotoUpload('candPhotoInput', 'candPhotoFrame', d => { photoData = d; });

    document.getElementById('candCancel').addEventListener('click', closeModal);
    document.getElementById('candSave').addEventListener('click', () => {
      const title = document.getElementById('candTitle').value.trim();
      if (!title){ alert('디자인 이름을 입력해주세요.'); return; }
      const memo = document.getElementById('candMemo').value.trim();
      if (existing){
        existing.title = title; existing.memo = memo; existing.photo = photoData;
        existing.season = [...tagState.season]; existing.color = [...tagState.color]; existing.mood = [...tagState.mood];
      } else {
        candidates.push({
          id: uid(), title, memo, photo: photoData,
          season: [...tagState.season], color: [...tagState.color], mood: [...tagState.mood],
          createdAt: todayStr(), lastDoneAt: null
        });
      }
      saveCandidates();
      renderCandidates();
      closeModal();
    });
    if (existing){
      document.getElementById('candDelete').addEventListener('click', () => {
        if (!confirm('이 디자인을 삭제할까요?')) return;
        candidates = candidates.filter(c => c.id !== existing.id);
        saveCandidates();
        renderCandidates();
        closeModal();
      });
    }
  }

  /* ---------- ARCHIVE MODAL ---------- */
  function getLastSalon(){
    if (archive.length === 0) return '';
    const sorted = [...archive].sort((a,b) => b.date.localeCompare(a.date));
    return sorted[0].salon || '';
  }

  function openArchiveModal(editId, fromCandidate){
    const existing = editId ? archive.find(a => a.id === editId) : null;
    let photoData = existing ? existing.photo : (fromCandidate ? fromCandidate.photo : null);
    let rating = existing ? (existing.rating || 0) : 0;
    const linkedCandidateId = existing ? (existing.candidateId || null) : (fromCandidate ? fromCandidate.id : null);
    const defaultTitle = existing ? existing.title : (fromCandidate ? fromCandidate.title : '');
    const lastSalon = existing ? '' : getLastSalon();

    box.innerHTML =
      '<h2>' + (existing ? '네일 기록 수정' : '네일 기록 남기기') + '</h2>' +
      '<label class="photo-upload" for="archPhotoInput">' +
        '<div class="photo-frame" id="archPhotoFrame">' +
          (photoData ? '<img src="'+photoData+'">' : '<span class="placeholder-icon">📷</span>') +
        '</div>' +
        '<span class="change-label">사진 선택</span>' +
      '</label>' +
      '<input type="file" id="archPhotoInput" accept="image/*" style="display:none">' +
      '<label class="form-label">디자인 이름</label>' +
      '<input class="form-input" id="archTitle" placeholder="예: 가을 브라운 프렌치" value="'+escapeHtml(defaultTitle)+'">' +
      '<label class="form-label">날짜</label>' +
      '<input class="form-input" type="date" id="archDate" value="'+(existing?existing.date:todayStr())+'">' +
      '<label class="form-label">샵 이름</label>' +
      '<input class="form-input" id="archSalon" placeholder="샵 이름" value="'+escapeHtml(existing?existing.salon:lastSalon)+'">' +
      '<label class="form-label">별점</label>' +
      '<div class="star-input" id="archStars"></div>' +
      '<label class="form-label">메모</label>' +
      '<textarea class="form-textarea" id="archMemo" placeholder="오늘 네일은 어땠나요?">'+escapeHtml(existing?existing.memo:'')+'</textarea>' +
      '<div class="modal-actions">' +
        '<button class="btn-secondary" id="archCancel">취소</button>' +
        '<button class="btn-primary" id="archSave">저장</button>' +
      '</div>' +
      (existing ? '<button class="btn-danger" id="archDelete">이 기록 삭제</button>' : '');

    overlay.hidden = false;

    function renderStarInput(){
      const el = document.getElementById('archStars');
      el.innerHTML = '';
      for (let i=1; i<=5; i++){
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'star-btn' + (i<=rating?' active':'');
        b.textContent = '★';
        b.addEventListener('click', () => { rating = i; renderStarInput(); });
        el.appendChild(b);
      }
    }
    renderStarInput();

    bindPhotoUpload('archPhotoInput', 'archPhotoFrame', d => { photoData = d; });

    document.getElementById('archCancel').addEventListener('click', closeModal);
    document.getElementById('archSave').addEventListener('click', () => {
      const title = document.getElementById('archTitle').value.trim() || '이름 없는 디자인';
      const date = document.getElementById('archDate').value || todayStr();
      const salon = document.getElementById('archSalon').value.trim();
      const memo = document.getElementById('archMemo').value.trim();
      if (existing){
        existing.title = title; existing.date = date; existing.salon = salon;
        existing.rating = rating; existing.memo = memo; existing.photo = photoData;
      } else {
        archive.push({
          id: uid(), candidateId: linkedCandidateId, title, date, salon, rating, memo, photo: photoData
        });
        if (linkedCandidateId){
          const c = candidates.find(c => c.id === linkedCandidateId);
          if (c) c.lastDoneAt = date;
          saveCandidates();
        }
      }
      saveArchive();
      renderArchive();
      renderCandidates();
      closeModal();
    });
    if (existing){
      document.getElementById('archDelete').addEventListener('click', () => {
        if (!confirm('이 기록을 삭제할까요?')) return;
        archive = archive.filter(a => a.id !== existing.id);
        saveArchive();
        renderArchive();
        closeModal();
      });
    }
  }

  /* ---------- init ---------- */
  renderFilters();
  renderCandidates();
  renderArchive();
})();
</script>
